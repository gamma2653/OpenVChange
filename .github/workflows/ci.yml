name: CI

# Lint and test every pull request, and main after each merge. Pull requests in a
# stack trigger this as if they targeted main, so every layer is checked.
#
# The version pull request is the exception. The release workflow opens it with
# the token of the workflow, and GitHub holds the runs of such a pull request
# until somebody approves them by hand. The release workflow therefore starts this
# workflow itself, through workflow_dispatch, which is never held.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    # The app targets Windows, and PyAudio ships ready-made wheels for it.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Tests build real widgets, so Qt needs a display-less platform.
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The locked NumPy (1.26) publishes no wheels for Python 3.13. There it is
      # compiled from source, which takes six minutes.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry>=2,<3"

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Lint
        run: poetry run ruff check .

      - name: Test
        run: poetry run pytest
