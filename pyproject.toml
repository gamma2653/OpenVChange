[tool.poetry]
name = "openvchange"
version = "0.1.0"
description = ""
authors = []
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
pyaudio = "^0.2.14"
pyside6 = "^6.6.0"
numpy = "^1.26.0"
scipy = "^1.11.0"

[tool.poetry.scripts]
openvchange = "openvchange.__main__:main"

[tool.poetry.group.dev.dependencies]
pyinstaller = "^6.22.3"
pytest = "^8"
ruff = ">=0.6"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint.per-file-ignores]
# Tests use bare asserts and compare against literal expected values.
"tests/**" = ["S101", "PLR2004"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
